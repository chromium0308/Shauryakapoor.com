<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0c0c0c; }
  * { box-sizing: border-box; }
  a { color: #3b8eea; }
  a:hover { color: #6aa9f0; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes drift { from{background-position:0 0} to{background-position:60px 60px} }
  @keyframes twinkle { 0%,49%{opacity:1} 50%,100%{opacity:0.25} }
  @keyframes shoot { 0%{opacity:0; transform:translate(0,0) rotate(18deg)} 3%{opacity:1} 12%{opacity:1; transform:translate(60vw,20vh) rotate(18deg)} 14%,100%{opacity:0} }
  ::selection { background: rgba(22,198,12,0.25); }
  .term-scroll::-webkit-scrollbar { width: 10px; }
  .term-scroll::-webkit-scrollbar-track { background: transparent; }
  .term-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 6px; }
</style>
</helmet>
<div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; background: #0c0c0c; font-family: 'JetBrains Mono', monospace;">
    <div style="display: flex; align-items: center; padding: 8px 14px; background: #2b2b2b; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;">
      <div style="flex: 1; color: #cfcfcf; font-size: 12.5px; letter-spacing: 0.02em;">shaurya@portfolio: {{ cwdLabel }}</div>
      <div style="display: flex; gap: 22px; color: #a8a8a8; font-size: 13px;">
        <span>&#8211;</span>
        <span>&#9633;</span>
        <span>&#10005;</span>
      </div>
    </div>
    <div class="term-scroll" ref="{{ scrollRef }}" onClick="{{ focusInput }}" style="position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 18px 20px; color: #cccccc; font-size: 14.5px; line-height: 1.6; cursor: text;">
      <sc-for list="{{ renderedLines }}" as="el" hint-placeholder-count="6">{{ el }}</sc-for>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="color: #16c60c; font-weight: 500; flex-shrink: 0;">shaurya@portfolio</span><span style="color: #767676; flex-shrink: 0;">:</span><span style="color: #3b8eea; font-weight: 500; flex-shrink: 0;">{{ cwdLabel }}</span><span style="color: #767676; flex-shrink: 0;">$</span>
        <span style="position: relative; flex: 1; min-width: 0;">
          <span style="white-space: pre-wrap; word-break: break-word; color: #cccccc;">{{ input }}</span><span style="display: inline-block; width: 8.5px; height: 1.05em; background: #cccccc; transform: translateY(2px); animation: blink 1.05s step-end infinite;"></span>
          <input ref="{{ inputRef }}" value="{{ input }}" onChange="{{ onChange }}" onKeyDown="{{ onKeyDown }}" autoFocus="{{ true }}" spellcheck="false" autocomplete="off" autocapitalize="off" style="position: absolute; inset: 0; opacity: 0; border: none; outline: none; background: transparent; font: inherit; color: transparent; width: 100%; caret-color: transparent;" />
        </span>
      </div>
    </div>
    {{ pagerNode }}
    {{ projViewNode }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  C = { txt: "#cccccc", dim: "#9a9a9a", accent: "#3b8eea", green: "#16c60c", dir: "#3b8eea", err: "#e74856", prompt: "#767676" };

  fs = {
    type: "dir",
    children: {
      "about": {
        type: "dir",
        children: {
          "bio.txt": { type: "file", content: [
            "Shaurya Kapoor — 18 y/o builder.",
            "Web Summit Scholar '25 · Eirspace Rocketry · Dublin.",
            "",
            "I build things across software and hardware — rockets,",
            "apps, drones, engines.",
          ] },
          "now.txt": { type: "file", content: [
            "★ Currently working on   (updated May 2026)",

            "  · Building rockets for Eirspace",

          ] },
          "contact.txt": { type: "file", content: [
            "email       shaurya@kapoor.ie",
            "github      github.com/chromium0308",
            "x/twitter   x.com/_chromium_0308",
            "linkedin    linkedin.com/in/shaurya-kapoor0308",
            "instagram   instagram.com/shauryak_0308",
          ] },
          "education.txt": { type: "file", content: [
            "University College Dublin      Sep 2025 — Jan 2026",

            "",
            "The Institute of Education      2023 — 2025",
            "  Leaving Certificate — 613 points",
          ] },
          "languages.txt": { type: "file", content: [
            "English    Fluent",
            "Hindi      Fluent",
            "German     B2 Level",
          ] },
        },
      },
      "experience": {
        type: "dir",
        children: {
          "yearbook.txt": { type: "file", render: "yearbook", content: [
            "A roughly-chronological transcript of teams I've been on,",
            "programmes I've gotten into, and benches I've spent too",
            "many hours at. Most recent up top.",
            "",
            "Jan 2026 — Jun 2026   AI Development Intern",
            "  Arcus Innovation Studios · 360 Social Impact Studios, Dublin",
            "  Combined AI with social-impact initiatives.",
            "",
            "2025                  Web Summit 2025 Scholar",
            "  Web Summit '25, Lisbon",
            "  Chairperson ticket (worth €25,000); access to global",
            "  tech leaders and startups.",
            "",
            "Sep 2025 — Jan 2026   Engineering, UCD  (dropped out)",
            "  Split time between coursework, the workshop, and whatever",
            "  side-project was eating my evenings.",
            "",
            "2023                  Web Summit — TY Work Experience",
            "  Week-long programme; explored multiple fields of work.",
            "",
            "2022                  IT Intern — Unipol RE",
            "  TY work experience shadowing the IT team.",
          ] },
        },
      },
      "projects": {
        type: "dir",
        children: {
          "current.txt": { type: "file", render: "projects", set: "current" },
          "archive.txt": { type: "file", render: "projects", set: "archive" },
        },
      },
      ".hidden": {
        type: "dir",
        children: {
          "notes.md": { type: "file", content: [
            "# The barely-started pile",
            "You found the hidden folder. Nice — `ls -a` pays off.",
            "This is where half-formed ideas live until they're real",
            "enough to move into projects/. Check back later :)",
          ] },
        },
      },
      "readme.txt": { type: "file", content: [
        "You're in Shaurya's terminal. Try:",
        "  ls           list this directory",
        "  cd projects  enter a directory",
        "  cat file     read a file",
        "  help         all commands",
      ] },
    },
  };

  state = {
    input: "",
    history: [],
    histIndex: null,
    cwd: [],
    projView: null,
    lines: [
      { kind: "neofetch", gap: "16px" },
      { text: "Welcome — you've reached Shaurya Kapoor's terminal.", color: "#16c60c", gap: "2px" },
      { text: "18 y/o builder · Web Summit Scholar '25 · Eirspace. This is a personal site that thought a plain landing page was too boring.", color: "#9a9a9a", gap: "14px" },
      { text: "Type 'ls' to see the different pages (about, projects, experience).", color: "#3b8eea", gap: "14px" },
      { text: "Tip: type 'help' anytime for the full list of commands.", color: "#767676", gap: "0" },
    ],
  };

  nodeAt(segments) {
    let node = this.fs;
    for (const seg of segments) {
      if (!node || node.type !== "dir") return null;
      node = node.children[seg];
    }
    return node || null;
  }

  cwdLabel(segments) { return segments.length ? "~/" + segments.join("/") : "~"; }

  resolvePath(arg, base) {
    let segs;
    if (arg === "~" || arg === "/") return [];
    if (arg.startsWith("/") || arg.startsWith("~/")) {
      segs = arg.replace(/^~?\//, "").split("/");
    } else {
      segs = base.concat(arg.split("/"));
    }
    const out = [];
    for (const s of segs) {
      if (s === "" || s === ".") continue;
      if (s === "..") { out.pop(); continue; }
      out.push(s);
    }
    return out;
  }

  push(newLines) { this.setState(s => ({ lines: s.lines.concat(newLines) })); }

  run(raw) {
    const C = this.C;
    const cwd = this.state.cwd;
    const echo = { text: "shaurya@portfolio:" + this.cwdLabel(cwd) + "$ " + raw, color: C.prompt, gap: "6px" };
    const cmd = raw.trim();
    if (!cmd) { this.push([echo]); return; }
    const parts = cmd.split(/\s+/);
    const name = parts[0].toLowerCase();
    const args = parts.slice(1);
    let out = [];

    const line = (text, color, gap) => ({ text, color: color || C.txt, gap: gap || "2px" });
    const last = (arr) => { if (arr.length) arr[arr.length - 1].gap = "0"; return arr; };

    if (name === "ls") {
      const showAll = args.includes("-a") || args.includes("-la") || args.includes("-al");
      const pathArg = args.find(a => !a.startsWith("-"));
      const target = pathArg ? this.resolvePath(pathArg, cwd) : cwd;
      const node = this.nodeAt(target);
      if (!node) { out = [line("ls: cannot access '" + pathArg + "': No such file or directory", C.err)]; }
      else if (node.type === "file") { out = [line(pathArg, C.txt)]; }
      else {
        let names = Object.keys(node.children).filter(n => showAll || !n.startsWith("."));
        if (showAll) names = [".", ".."].concat(names);
        const entries = names.map(n => {
          const isDot = n === "." || n === "..";
          const isDir = isDot || (node.children[n] && node.children[n].type === "dir");
          return { n: isDir && !isDot ? n + "/" : n, dir: isDir };
        });
        out = entries.length ? entries.map(e => line("  " + e.n, e.dir ? C.dir : C.txt)) : [line("(empty)", C.dim)];
      }
    } else if (name === "cd") {
      const target = args[0] ? this.resolvePath(args[0], cwd) : [];
      const node = this.nodeAt(target);
      if (!node) { out = [line("cd: " + args[0] + ": No such file or directory", C.err)]; }
      else if (node.type !== "dir") { out = [line("cd: " + args[0] + ": Not a directory", C.err)]; }
      else { this.setState({ cwd: target }); }
    } else if (name === "cat") {
      if (!args[0]) { out = [line("cat: missing file operand", C.err)]; }
      else {
        const target = this.resolvePath(args[0], cwd);
        const node = this.nodeAt(target);
        if (!node) out = [line("cat: " + args[0] + ": No such file or directory", C.err)];
        else if (node.type === "dir") out = [line("cat: " + args[0] + ": Is a directory", C.err)];
        else if (node.render === "yearbook") { this.push([echo, { kind: "yearbook", gap: "0" }]); return; }
        else if (node.render === "projects") {
          this.setState(s => ({ lines: s.lines.concat([echo]), projView: { set: node.set, sel: 0 } }));
          return;
        }
        else {
          const rows = Math.max(6, Math.floor((window.innerHeight - 150) / 23));
          this.setState(s => ({ lines: s.lines.concat([echo]), pager: { path: args[0], lines: node.content, top: 0, rows } }));
          return;
        }
      }
    } else if (name === "pwd") {
      out = [line("/home/shaurya" + (cwd.length ? "/" + cwd.join("/") : ""), C.txt)];
    } else if (name === "tree") {
      out = this.buildTree(this.fs, "", args.includes("-a"), line);
    } else if (name === "help") {
      out = [
        line("Available commands:", C.accent, "4px"),
        line("  ls [dir]        list a directory", C.txt),
        line("  cd <dir>        change directory (.. , ~, / work too)", C.txt),
        line("  cat <file>      print a file's contents", C.txt),
        line("  pwd             print the current path", C.txt),
        line("  tree [-a]       show the whole filesystem", C.txt),
        line("  clear           clear the screen", C.txt),
        line("  help            show this list", C.txt),
      ];
    } else if (name === "clear" || name === "cls") {
      this.setState({ lines: [], input: "" });
      return;
    } else if (name === "whoami") {
      out = [line("shaurya", C.txt)];
    } else {
      out = [ line(name + ": command not found", C.err), line("Type 'help' to see what's available.", C.dim) ];
    }
    this.push([echo].concat(last(out)));
  }

  buildTree(node, prefix, showAll, line) {
    const out = [];
    let names = Object.keys(node.children).filter(n => showAll || !n.startsWith("."));
    names.forEach((n, i) => {
      const child = node.children[n];
      const isLast = i === names.length - 1;
      const branch = isLast ? "└── " : "├── ";
      const isDir = child.type === "dir";
      out.push(line(prefix + branch + n + (isDir ? "/" : ""), isDir ? this.C.dir : this.C.txt));
      if (isDir) this.buildTree(child, prefix + (isLast ? "    " : "│   "), showAll, line).forEach(l => out.push(l));
    });
    return out;
  }

  yearbookEntries = [
    { date: "Jan–Jun 2026", role: "AI Development Intern", org: "Arcus Innovation Studios · 360 Social Impact Studios", desc: "Combined AI with social-impact initiatives.", tags: ["Intern", "AI"] },
    { date: "2025", role: "Web Summit 2025 Scholar", org: "Web Summit '25 · Lisbon", desc: "Chairperson ticket (worth €25,000); access to global tech leaders and startups.", tags: ["Scholar"] },
    { date: "Sep 2025–Jan 2026", role: "Engineering (B.Eng)", org: "University College Dublin", desc: "Coursework, the workshop, and evening side-projects. Dropped out to build full-time.", tags: ["UCD"] },
    { date: "2023", role: "Web Summit — TY Work Experience", org: "Web Summit · Lisbon", desc: "Week-long programme; explored multiple fields of work.", tags: ["TY", "Week-Long"] },
    { date: "2022", role: "IT Intern", org: "Unipol RE", desc: "TY work experience shadowing the IT team.", tags: ["TY", "Shadowing"] },
  ];

  renderYearbook(key) {
    const h = React.createElement;
    const chip = (t, i) => h("span", { key: i, style: { color: "#3b8eea", border: "1px solid #26364a", padding: "1px 8px", borderRadius: "3px", fontSize: "11.5px" } }, t);
    const entry = (e, i) => h("div", { key: i, style: { display: "grid", gridTemplateColumns: "150px 1fr", columnGap: "16px" } },
      h("div", { style: { color: "#3b8eea", textAlign: "right" } }, e.date),
      h("div", { style: { borderLeft: "2px solid #2f2f2f", paddingLeft: "16px", position: "relative" } },
        h("div", { style: { position: "absolute", left: "-5px", top: "6px", width: "8px", height: "8px", borderRadius: "50%", background: "#16c60c" } }),
        h("div", { style: { color: "#eaeaea", fontWeight: 700 } }, e.role),
        h("div", { style: { color: "#9a9a9a" } }, e.org),
        h("div", { style: { color: "#767676", marginTop: "4px" } }, e.desc),
        e.tags && e.tags.length ? h("div", { style: { display: "flex", gap: "8px", marginTop: "8px", flexWrap: "wrap" } }, e.tags.map((t, j) => chip(t, j))) : null,
      ),
    );
    return h("div", { key, style: { display: "flex", flexDirection: "column", gap: "20px", margin: "4px 0 2px" } },
      h("div", { style: { color: "#9a9a9a", marginBottom: "2px" } }, "A roughly-chronological transcript of teams, programmes, and benches. Most recent up top."),
      ...this.yearbookEntries.map((e, i) => entry(e, i)),
    );
  }

  currentProjects = [
    { no: "01", when: "Now · 2026", title: "Eirspace Rocketry", sub: "Rocketry · IRL", desc: "Rocketry program where we build rockets to compete in EUROC. Yes, it really is rocket science.", stack: ["SolidWorks", "Ansys", "OpenRocket", "Excel"], link: "https://www.eirspace.org/about", linkLabel: "eirspace.org", imgLabel: "signed rocket fin" },
    { no: "02", when: "Now · 2026", title: "Docking Drone", sub: "Hardware · Self-Docking", desc: "A drone that deploys from a vertical surface and self-docks to a charging station using a magnetic hinge built into the dock.", stack: ["SolidWorks", "Arduino"], img: "https://www.shauryakapoor.com/assets/vdd.jpg", imgLabel: "drone concept" },
    { no: "03", when: "Now · 2026", title: "Abandoned Train Line Cart", sub: "Woodwork · Hardware", desc: "Designing and manufacturing a cart meant to run on abandoned Irish train lines.", stack: ["Woodwork", "Hardware"], img: "https://www.shauryakapoor.com/assets/train-cart.png", imgLabel: "workshop progress" },
  ];

  archiveProjects = [
    { no: "—", when: "Shelved · 2026", title: "Zenemic", sub: "Event-Planning · iOS", desc: "An event-planning assistance app that reached beta on iOS before being shelved.", stack: ["React Native", "Expo", "Swift"], img: "https://www.shauryakapoor.com/assets/zenemic.png", imgLabel: "Zenemic · iOS" },
    { no: "06", when: "2026", title: "Pairs Trading AAPL & SPY", sub: "Quant · Statistical Arbitrage", desc: "A statistical-arbitrage strategy trading the mean-reverting spread between AAPL and SPY, backtested on historical data.", stack: ["Python"], link: "https://github.com/chromium0308/Pairs_trading_AAPL_and_SPY", linkLabel: "GitHub", imgLabel: "AAPL / SPY" },
    { no: "07", when: "2025", title: "Ventria", sub: "Health · Apple Watch", desc: "HIPAA-secured heart-monitoring app with Apple Watch sync — heart rate, HRV, steps, sleep, and AI-powered heart-failure risk insights.", stack: ["Xcode", "Swift"], link: "https://medathon-production.up.railway.app/", linkLabel: "Demo", imgLabel: "Medathon" },
    { no: "08", when: "2025", title: "UCDFS", sub: "Formula Student", desc: "Working on a student F1 car for Formula Student at Silverstone (E135), pushing automotive engineering.", stack: ["Ansys", "Onshape"], link: "https://ucdfs.ie/home-1", linkLabel: "ucdfs.ie", imgLabel: "Silverstone · E135" },
    { no: "09", when: "2026", title: "ExamEasy", sub: "AI Tutor · Leaving Cert", desc: "A Leaving Cert exam-question tutor that uses AI to teach every step of every problem.", stack: ["React", "Next.js", "Python"], link: "https://Exameasy.ie", linkLabel: "exameasy.ie", imgLabel: "all subjects" },
    { no: "10", when: "2026", title: "Braille Reader", sub: "Accessibility", desc: "An app for learning Braille, supported by hardware prototypes for tactile feedback.", stack: ["React Native", "Expo", "Gemini"], img: "https://www.shauryakapoor.com/assets/braille.png", imgLabel: "prototype" },
    { no: "11", when: "2024", title: "Model Jet Engine", sub: "Workshop · Hands-on", desc: "Built a partially functional jet engine from hairdryer scrap parts, exploring fundamental physics hands-on.", stack: ["SolidWorks"], img: "https://www.shauryakapoor.com/assets/jet-engine.png", imgLabel: "scrap-built" },
    { no: "12", when: "2026", title: "Movinnit.ai", sub: "AI · Relocation", desc: "An AI web platform that simplifies international relocation by handling complex paperwork and documentation.", stack: ["Next.js", "Python"], link: "https://movinnitai.up.railway.app/", linkLabel: "movinnit.ai", imgLabel: "Movinnit.ai" },
    { no: "13", when: "2024", title: "SolidWorks IDE", sub: "Shelved · Cloud Tooling", desc: "A cloud-based IDE that turns SolidWorks files into STEP format for editing and collaboration in the cloud.", stack: ["Next.js", "Python", "SolidWorks API"], img: "https://www.shauryakapoor.com/assets/solidworks.png", imgLabel: "IDE" },
    { no: "14", when: "2023", title: "Vex V5 Robotics", sub: "Robotics", desc: "Competed in Vex robotics with the Institute of Education team, designing and building competitive robots.", stack: ["Onshape", "SolidWorks"], link: "https://www.vexrobotics.com/v5/competition/vrc-current-game", linkLabel: "vexrobotics.com", imgLabel: "season bot" },
    { no: "15", when: "2023", title: "Dukes Schools Competition", sub: "Best Engineered Solution", desc: "Winner, Best Engineered Solution — represented The Institute of Education internationally in London.", stack: [], img: "https://www.shauryakapoor.com/assets/dukes.png", imgLabel: "winners' stage" },
    { no: "16", when: "2023", title: "Build Space S5", sub: "Nights & Weekends", desc: "Conceptualised an energy-generating speed breaker that harnesses kinetic energy from vehicles.", stack: [], link: "https://buildspace.so/s5/welcome", linkLabel: "buildspace", imgLabel: "S5" },
    { no: "17", when: "2023", title: "TDI Challenge Signing Glove", sub: "Accessibility · CAD", desc: "Designed and modelled a signing glove to help deaf people learn sign language.", stack: ["SolidWorks"], link: "https://www.mta.org.uk/resources/the-tdi-challenge/", linkLabel: "mta.org.uk", imgLabel: "signing glove · CAD" },
    { no: "18", when: "2023", title: "TEDI London — Eco Lotus", sub: "Award · Most Creative", desc: "Won Most Creative Design with Eco Lotus, a sustainable design combining innovation with environmental thinking.", stack: ["SolidWorks"], link: "https://asu-london.ac.uk/study-with-us/thinking-ahead-taster-programme/", linkLabel: "asu-london.ac.uk", imgLabel: "Eco Lotus" },
    { no: "19", when: "2023", title: "V6 Engine", sub: "CAD Deep-Dive", desc: "Designed and modelled a complete V6 engine, mastering the intricacies of SolidWorks (guided by Alex's Engineering).", stack: ["SolidWorks"], img: "https://www.shauryakapoor.com/assets/v6-engine.png", imgLabel: "wireframe render" },
  ];

  thumb(p, w, h_, fs) {
    const h = React.createElement;
    return h("div", { style: { position: "relative", width: w, height: h_, borderRadius: "4px", overflow: "hidden", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "repeating-linear-gradient(45deg,#141414,#141414 7px,#191919 7px,#191919 14px)" } },
      h("span", { style: { color: "#5a5a5a", fontSize: fs, textAlign: "center", padding: "0 4px", lineHeight: 1.3 } }, p.imgLabel),
      p.img ? h("img", { src: p.img, alt: p.title, loading: "lazy", onError: (e) => { e.target.style.display = "none"; }, style: { position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" } }) : null,
    );
  }

  renderProjView() {
    const h = React.createElement;
    const pv = this.state.projView;
    const list = pv.set === "current" ? this.currentProjects : this.archiveProjects;
    const sel = Math.min(pv.sel, list.length - 1);
    const hero = list[sel];
    const caption = pv.set === "current" ? "★ On the bench right now" : "★ In the archive — built, broken, or stubbornly finished";
    const chip = (t, i) => h("span", { key: i, style: { color: "#9a9a9a", border: "1px solid #2a2a2a", padding: "1px 8px", borderRadius: "3px", fontSize: "11px" } }, t);

    const heroCard = h("div", { style: { display: "grid", gridTemplateColumns: "260px 1fr", gap: "18px", border: "1px solid #3a3a3a", borderRadius: "6px", overflow: "hidden", background: "#0f0f0f", boxShadow: "inset 3px 0 0 #16c60c" } },
      this.thumb(hero, "260px", "178px", "11px"),
      h("div", { style: { padding: "16px 18px 16px 0", minWidth: 0 } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: "10px" } },
          h("span", { style: { color: "#16c60c", fontWeight: 700 } }, "No. " + sel + " · Featured"),
          h("span", { style: { color: "#767676", fontSize: "11.5px" } }, hero.when),
        ),
        h("div", { style: { color: "#eaeaea", fontWeight: 700, fontSize: "18px", marginTop: "4px" } }, hero.title),
        h("div", { style: { color: "#9a9a9a", fontSize: "12px", marginTop: "2px" } }, hero.sub),
        h("div", { style: { color: "#767676", marginTop: "8px", lineHeight: 1.5 } }, hero.desc),
        h("div", { style: { display: "flex", flexWrap: "wrap", gap: "7px", marginTop: "12px", alignItems: "center" } },
          ...hero.stack.map((t, j) => chip(t, j)),
          hero.link ? h("a", { key: "lnk", href: hero.link, target: "_blank", rel: "noreferrer", style: { color: "#3b8eea", marginLeft: "auto" } }, hero.linkLabel + " →") : null,
        ),
      ),
    );

    const row = (p, j) => {
      const on = j === sel;
      return h("div", { key: j, ref: on ? (el) => { this.projSelEl = el; } : null, onClick: () => this.setState(s => ({ projView: { ...s.projView, sel: j } })), style: { display: "grid", gridTemplateColumns: "16px 44px 1fr auto", columnGap: "10px", alignItems: "center", padding: "9px 8px", borderTop: "1px solid #1c1c1c", cursor: "pointer", borderRadius: "4px", background: on ? "rgba(22,198,12,0.10)" : "transparent" } },
        h("span", { style: { color: "#16c60c", fontWeight: 700, textAlign: "center" } }, on ? "»" : ""),
        this.thumb(p, "44px", "34px", "8px"),
        h("div", { style: { minWidth: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } },
          h("span", { style: { color: "#16c60c", fontWeight: 700, fontSize: "12px" } }, j + " "),
          h("span", { style: { color: on ? "#ffffff" : "#eaeaea", fontWeight: 700 } }, p.title),
          h("span", { style: { color: "#767676", fontSize: "11.5px" } }, " — " + p.sub),
        ),
        p.link ? h("a", { href: p.link, target: "_blank", rel: "noreferrer", onClick: (e) => e.stopPropagation(), style: { color: "#3b8eea", fontSize: "12px", flexShrink: 0 } }, p.linkLabel + " →") : h("span", { style: { color: "#767676", fontSize: "11.5px", flexShrink: 0 } }, p.when),
      );
    };

    return h("div", { onClick: () => { if (this.inputEl) this.inputEl.focus(); }, style: { position: "fixed", inset: 0, background: "#0c0c0c", display: "flex", flexDirection: "column", fontFamily: "'JetBrains Mono', monospace", zIndex: 50 } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px", padding: "10px 20px", background: "#1a1a1a", borderBottom: "1px solid #2f2f2f", flexShrink: 0 } },
        h("span", { style: { color: "#3b8eea", fontSize: "13px" } }, caption),
        h("span", { style: { color: "#767676", fontSize: "12px" } }, "\u2191/\u2193 browse · enter opens link · q quit"),
      ),
      h("div", { style: { padding: "18px 20px 8px", flexShrink: 0 } }, heroCard),
      h("div", { ref: (el) => { this.projListEl = el; }, style: { flex: 1, overflowY: "auto", padding: "4px 20px 20px", display: "flex", flexDirection: "column" } },
        ...list.map((p, j) => row(p, j)),
      ),
    );
  }

  renderPager() {
    const h = React.createElement;
    const p = this.state.pager;
    const end = Math.min(p.top + p.rows, p.lines.length);
    const win = p.lines.slice(p.top, end);
    const atEnd = end >= p.lines.length;
    const pct = p.lines.length <= p.rows ? "ALL" : (atEnd ? "END" : Math.round((p.top / Math.max(1, p.lines.length - p.rows)) * 100) + "%");
    const go = (top) => this.setState(s => ({ pager: { ...s.pager, top: Math.max(0, Math.min(top, Math.max(0, s.pager.lines.length - s.pager.rows))) } }));
    return h("div", {
      onWheel: (e) => { e.preventDefault(); go(p.top + (e.deltaY > 0 ? 3 : -3)); },
      onClick: () => { if (this.inputEl) this.inputEl.focus(); },
      style: { position: "fixed", inset: 0, background: "#0c0c0c", display: "flex", flexDirection: "column", fontFamily: "'JetBrains Mono', monospace", zIndex: 50 },
    },
      h("div", { style: { padding: "6px 16px", background: "#1a1a1a", color: "#767676", fontSize: "12px", borderBottom: "1px solid #2f2f2f", flexShrink: 0 } }, "less — " + p.path),
      h("div", { style: { flex: 1, overflow: "hidden", padding: "12px 20px", fontSize: "14.5px", lineHeight: "23px", color: "#cccccc" } },
        ...win.map((t, i) => h("div", { key: i, style: { whiteSpace: "pre-wrap", wordBreak: "break-word" } }, t === "" ? "\u00a0" : t)),
      ),
      h("div", { style: { display: "flex", justifyContent: "space-between", gap: "16px", background: "#cccccc", color: "#0c0c0c", padding: "3px 14px", fontSize: "12.5px", flexShrink: 0 } },
        h("span", { style: { fontWeight: 700 } }, p.path + "  ·  lines " + (p.top + 1) + "\u2013" + end + "/" + p.lines.length + "  " + pct),
        h("span", { style: { color: "#3a3a3a" } }, "\u2191/\u2193 scroll · space page · g/G ends · q quit"),
      ),
    );
  }

  renderNeofetch(key) {
    const h = React.createElement;
    const kv = (k, v) => h("div", { key: k }, h("span", { style: { color: "#3b8eea" } }, k), h("span", { style: { color: "#767676" } }, ": "), h("span", { style: { color: "#cccccc" } }, v));
    const dot = (c, i) => h("span", { key: i, style: { width: "14px", height: "14px", background: c, display: "inline-block" } });
    return h("div", { key, style: { display: "flex", gap: "20px", alignItems: "flex-start", fontSize: "13.5px", lineHeight: 1.6, flexWrap: "wrap" } },
      h("div", { style: { width: "96px", height: "96px", border: "1px solid #2f2f2f", borderRadius: "6px", display: "flex", alignItems: "center", justifyContent: "center", color: "#16c60c", fontWeight: 700, fontSize: "34px", letterSpacing: "2px", flexShrink: 0, background: "repeating-linear-gradient(45deg,#0f0f0f,#0f0f0f 7px,#121212 7px,#121212 14px)" } }, "SK"),
      h("div", { style: { minWidth: 0 } },
        h("div", null, h("span", { style: { color: "#16c60c", fontWeight: 700 } }, "shaurya"), h("span", { style: { color: "#767676" } }, "@"), h("span", { style: { color: "#16c60c", fontWeight: 700 } }, "portfolio")),
        h("div", { style: { color: "#2f2f2f" } }, "─────────────────────────"),
        kv("role", "18 y/o builder"),
        kv("now", "MEng Engineering with Management 26/27 · Trinity College Dublin"),
      ),
    );
  }

  renderLine(l, i) {
    if (l.kind === "neofetch") return this.renderNeofetch(i);
    if (l.kind === "yearbook") return this.renderYearbook(i);
    return React.createElement("div", { key: i, style: { whiteSpace: "pre-wrap", wordBreak: "break-word", color: l.color, marginBottom: l.gap } }, l.text);
  }

  scrollToBottom() { const el = this.scrollEl; if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; }); }
  ensureSelVisible() {
    const c = this.projListEl, el = this.projSelEl;
    if (!c || !el) return;
    const top = el.offsetTop, bottom = top + el.offsetHeight;
    if (top < c.scrollTop) c.scrollTop = top - 8;
    else if (bottom > c.scrollTop + c.clientHeight) c.scrollTop = bottom - c.clientHeight + 8;
  }

  componentDidUpdate() { if (this.state.projView) this.ensureSelVisible(); else this.scrollToBottom(); }

  renderVals() {
    return {
      renderedLines: this.state.lines.map((l, i) => this.renderLine(l, i)),
      pagerNode: this.state.pager ? this.renderPager() : null,
      projViewNode: this.state.projView ? this.renderProjView() : null,
      input: this.state.input,
      cwdLabel: this.cwdLabel(this.state.cwd),
      scrollRef: (el) => { this.scrollEl = el; },
      inputRef: (el) => { this.inputEl = el; },
      focusInput: () => { if (this.inputEl) this.inputEl.focus(); },
      onChange: (e) => this.setState({ input: e.target.value }),
      onKeyDown: (e) => {
        if (this.state.pager) {
          const p = this.state.pager;
          const max = Math.max(0, p.lines.length - p.rows);
          const go = (top) => this.setState(s => ({ pager: { ...s.pager, top: Math.max(0, Math.min(top, Math.max(0, s.pager.lines.length - s.pager.rows))) } }));
          if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); go(p.top + 1); }
          else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); go(p.top - 1); }
          else if (e.key === " " || e.key === "PageDown") { e.preventDefault(); go(p.top + p.rows - 1); }
          else if (e.key === "b" || e.key === "PageUp") { e.preventDefault(); go(p.top - p.rows + 1); }
          else if (e.key === "g") { e.preventDefault(); go(0); }
          else if (e.key === "G") { e.preventDefault(); go(max); }
          else if (e.key === "q" || e.key === "Escape" || e.key === "Enter") { e.preventDefault(); this.setState({ pager: null }); if (this.inputEl) this.inputEl.focus(); }
          return;
        }
        if (this.state.projView) {
          const pv = this.state.projView;
          const list = pv.set === "current" ? this.currentProjects : this.archiveProjects;
          if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); this.setState(s => ({ projView: { ...s.projView, sel: Math.min(s.projView.sel + 1, list.length - 1) } })); }
          else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); this.setState(s => ({ projView: { ...s.projView, sel: Math.max(s.projView.sel - 1, 0) } })); }
          else if (e.key === "Enter") { e.preventDefault(); const p = list[pv.sel]; if (p && p.link) window.open(p.link, "_blank", "noopener"); }
          else if (e.key === "q" || e.key === "Escape") { e.preventDefault(); this.setState({ projView: null }); if (this.inputEl) this.inputEl.focus(); }
          return;
        }
        if (e.key === "Enter") {
          const raw = this.state.input;
          this.run(raw);
          this.setState(s => ({ input: "", history: raw.trim() ? [raw].concat(s.history) : s.history, histIndex: null }));
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          this.setState(s => { if (!s.history.length) return {}; const i = s.histIndex === null ? 0 : Math.min(s.histIndex + 1, s.history.length - 1); return { histIndex: i, input: s.history[i] }; });
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          this.setState(s => { if (s.histIndex === null) return {}; const i = s.histIndex - 1; if (i < 0) return { histIndex: null, input: "" }; return { histIndex: i, input: s.history[i] }; });
        } else if (e.key === "l" && e.ctrlKey) {
          e.preventDefault();
          this.setState({ lines: [], input: "" });
        }
      },
    };
  }
}
</script>
